name: Publish F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate F-Droid Repository
        uses: theapache64/fdroid-repo-action@v1
        with:
          apk_path: app/build/outputs/apk/release/*.apk
          repo_name: "Saurabh Kundu Apps"
          repo_description: "Personal F-Droid repository for Secure Password Manager"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid_repo'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
