name: Publish F-Droid Repository

on:
  push:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools 29.0.3
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Build F-Droid Repository
        run: |
          sudo apt-get update && sudo apt-get install -y aapt
          pipx install fdroidserver
          mkdir -p fdroid_repo/repo
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} fdroid_repo/repo/
          cd fdroid_repo
          cat << 'EOF' > config.yml
          repo_name: "Applify"
          repo_description: "Applify Official F-Droid Repository"
          repo_url: "https://saurabhkundu1.github.io/secure-password-manager/repo"
          archive_older: 0
          EOF
          fdroid update --create-metadata --create-key
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid_repo'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
