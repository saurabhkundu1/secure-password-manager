name: Publish F-Droid Repository & GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools 29.0.3
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: Build F-Droid Repository
        run: |
          sudo apt-get update && sudo apt-get install -y aapt python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          export PATH=$PATH:$HOME/.local/bin

          # Decode the persistent signing keystore OUTSIDE fdroid_repo directory
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

          mkdir -p fdroid_repo/repo
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} fdroid_repo/repo/app-release.apk

          cd fdroid_repo
          cat << EOF > config.yml
          repo_name: "Applify"
          repo_description: "Applify Official F-Droid Repository"
          repo_url: "https://saurabhkundu1.github.io/secure-password-manager/repo"
          keystore: "../keystore.jks"
          repo_keyalias: "${{ secrets.KEY_ALIAS }}"
          keystorepass: "${{ secrets.KEYSTORE_PASSWORD }}"
          keypass: "${{ secrets.KEY_PASSWORD }}"
          archive_older: 0
          EOF

          # Generate index and sign repository using persistent keystore
          fdroid update --create-metadata
          fdroid signindex

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid_repo'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
