name: Publish F-Droid Repository & GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools 29.0.3
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Assets & Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ github.ref_name }}"
          APK_NAME="SecurePass-${VERSION}-signed.apk"
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} "${APK_NAME}"

          SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')

          cat << EOF > RELEASE_NOTES.md
          # 🔐 Secure Pass ${VERSION}

          ## 🌟 Release Highlights (${VERSION})

          ### 🎨 Theme-Aware App Icons & Personalization
          - Added dynamic **Light** and **Dark Mode** icon variants for 5 core color schemes:
            - **Classic Blue** (\`classic_blue.png\`)
            - **Crimson Red** (\`crimson_red.png\`)
            - **Royal Purple** (\`royal_purple.png\`)
            - **Forest Green** (\`forest_green.png\`)
            - **Amber Gold** (\`amber_gold.png\`)
          - In-app color palette selection automatically synchronizes both the UI theme and display icons with system and app night mode settings.

          ### 🐛 F-Droid Repository & Integrity Verification
          - Implemented persistent keystore signing for the **Applify F-Droid Repository**.
          - Resolved Droid-ify *"Couldn't verify integrity"* errors by maintaining static index signature keys across CI deployments.

          ---

          ### 🔒 Core Features
          - **Offline First**: 100% data privacy with zero internet permissions.
          - **Military-Grade Encryption**: AES-256-GCM authenticated encryption for vault storage.
          - **Biometric Authentication**: Hardware-backed fingerprint unlock.
          - **Encrypted Backup & Restore**: Secure export/import of password vault items.

          ---

          ### 📦 Verified Release Package
          - **File Name**: \`${APK_NAME}\`
          - **SHA-256 Checksum**: \`${SHA256}\`
          - **Minimum Android Version**: Android 8.0 (API 26)
          - **Target Android Version**: Android 15 (API 35)

          Download the signed \`.apk\` asset below to install directly on your Android device.
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SecurePass-${{ github.ref_name }}-signed.apk
          name: Secure Pass ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Build F-Droid Repository
        run: |
          sudo apt-get update && sudo apt-get install -y aapt python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          export PATH=$PATH:$HOME/.local/bin

          # Decode the persistent signing keystore OUTSIDE fdroid_repo directory
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

          mkdir -p fdroid_repo/repo

          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          VC=$(aapt dump badging "$SIGNED_APK" | grep versionCode | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          if [ -z "$VC" ]; then VC="2"; fi

          # Copy signed APK with standard F-Droid naming and default naming
          cp "$SIGNED_APK" "fdroid_repo/repo/com.applify.securepass_${VC}.apk"
          cp "$SIGNED_APK" "fdroid_repo/repo/app-release.apk"

          cd fdroid_repo
          cat << EOF > config.yml
          repo_name: "Applify"
          repo_description: "Applify Official F-Droid Repository"
          repo_url: "https://saurabhkundu1.github.io/secure-password-manager/repo"
          sdk_path: "${ANDROID_HOME}"
          keystore: "../keystore.jks"
          repo_keyalias: "${{ secrets.KEY_ALIAS }}"
          keystorepass: "${{ secrets.KEYSTORE_PASSWORD }}"
          keypass: "${{ secrets.KEY_PASSWORD }}"
          archive_older: 0
          EOF

          # Generate index and sign repository using persistent keystore
          fdroid update --create-metadata --pretty
          fdroid signindex

          # Copy generated index and apk to root of fdroid_repo so both root URL and /repo URL work in Droid-ify
          cp -r repo/* ./

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid_repo'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
