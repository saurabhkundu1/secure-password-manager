name: Publish F-Droid Repository & GitHub Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools (29.0.3 & 34.0.0)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Assets & Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ github.ref_name }}"
          APK_NAME="SecurePass-${VERSION}-signed.apk"
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} "${APK_NAME}"
          SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')

          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases | grep '"id":' | sed -E 's/.*: ([0-9]+).*/\1/')
          for rel_id in $RELEASES; do
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/$rel_id || true
          done

          {
            echo "# Secure Pass ${VERSION}"
            echo ""
            echo "## Official Production Release (${VERSION})"
            echo ""
            echo "### Features"
            echo "- AES-256-GCM encrypted local vault"
            echo "- 6-digit master code with optional fingerprint unlock"
            echo "- Clipboard auto-clear, password generator"
            echo "- Dark/Light/System theme modes"
            echo ""
            echo "### Package"
            echo "- File: \`${APK_NAME}\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo "- Min Android: 8.0 (API 26)"
            echo "- Target Android: 15 (API 35)"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SecurePass-${{ github.ref_name }}-signed.apk
          name: Secure Pass ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Build F-Droid Repository
        run: |
          sudo apt-get update && sudo apt-get install -y aapt python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          export PATH=$PATH:$HOME/.local/bin

          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

          mkdir -p fdroid_repo/repo
          mkdir -p fdroid_repo/metadata/com.applify.securepass/en-US/images

          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          VC=$(aapt dump badging "$SIGNED_APK" | grep versionCode | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          VN=$(aapt dump badging "$SIGNED_APK" | grep versionName | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")
          if [ -z "$VC" ]; then VC="1"; fi
          if [ -z "$VN" ]; then VN="1.0.0"; fi

          cp "$SIGNED_APK" "fdroid_repo/repo/com.applify.securepass_${VC}.apk"

          cp fastlane/metadata/android/en-US/*.txt fdroid_repo/metadata/com.applify.securepass/en-US/ || true
          cp app/src/main/res/drawable/classic_blue.png fdroid_repo/metadata/com.applify.securepass/en-US/images/icon.png || true
          cp app/src/main/res/drawable/classic_blue.png fdroid_repo/icon.png || true

          {
            echo "Categories:"
            echo "  - Security"
            echo "License: MIT"
            echo "WebSite: \"https://github.com/saurabhkundu1/secure-password-manager\""
            echo "SourceCode: \"https://github.com/saurabhkundu1/secure-password-manager\""
            echo "IssueTracker: \"https://github.com/saurabhkundu1/secure-password-manager/issues\""
            echo "Name: \"Secure Pass\""
            echo "Summary: \"Offline Secure Password Manager\""
            echo "Description: |-"
            echo "  Secure Password Manager with AES-256-GCM encryption."
            echo "AutoName: \"Secure Pass\""
            echo "CurrentVersion: \"${VN}\""
            echo "CurrentVersionCode: ${VC}"
          } > fdroid_repo/metadata/com.applify.securepass.yml

          cd fdroid_repo
          {
            echo "repo_name: \"Applify\""
            echo "repo_icon: \"icon.png\""
            echo "repo_description: \"Applify Official F-Droid Repository\""
            echo "repo_url: \"https://saurabhkundu1.github.io/Applify/repo\""
            echo "sdk_path: \"${ANDROID_HOME}\""
            echo "keystore: \"../keystore.jks\""
            echo "repo_keyalias: \"${{ secrets.KEY_ALIAS }}\""
            echo "keystorepass: \"${{ secrets.KEYSTORE_PASSWORD }}\""
            echo "keypass: \"${{ secrets.KEY_PASSWORD }}\""
            echo "archive_older: 0"
          } > config.yml

          fdroid update --pretty
          fdroid signindex

          cp -r repo/* ./

          touch .nojekyll
          touch repo/.nojekyll

      - name: Deploy to Applify Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd fdroid_repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update F-Droid repo ${{ github.ref_name }}"
          git branch -M main
          git remote add origin https://x-access-token:${GH_PAT}@github.com/saurabhkundu1/Applify.git
          git push -f origin main
