name: Publish F-Droid Repository & GitHub Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build & Sign APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3" "build-tools;35.0.0"

      - name: Sign APK with Android SDK apksigner
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk app-release-aligned.apk
          
          rm -f release.jks

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app-release-signed.apk
          retention-days: 1

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-sign
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Signed APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: release_apk

      - name: Prepare Release Assets & Notes
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}"
          SIGNED_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
          APK_NAME="SecurePass-${VERSION}-signed.apk"
          cp "$SIGNED_APK" "${APK_NAME}"
          SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')

          cat << EOF > RELEASE_NOTES.md
          # 🔐 Secure Pass ${VERSION}

          ## 🚀 Official Production Release (${VERSION})

          ### 📱 Features
          - **AES-256-GCM Encrypted Vault**: High-security local encrypted storage.
          - **Shuffled Number Pad**: Randomized 12-button lock screen numpad on every launch.
          - **Popular Site Presets**: One-touch quick add for Google, GitHub, Amazon, Netflix, Banking, PayPal, Microsoft, Apple, etc.
          - **24-Hour Master Code Policy**: Mandatory master code verification every 24 hours.
          - **Mandatory 6-Digit Backup Key**: Enforced 6-character backup encryption password policy.
          - **8 Custom Swipe Actions**: Configurable swipe gestures with fading color trails.

          ---

          ### 📦 Verified Release Package
          - **File Name**: \`${APK_NAME}\`
          - **SHA-256 Checksum**: \`${SHA256}\`
          - **Minimum Android Version**: Android 8.0 (API 26)
          - **Target Android Version**: Android 15 (API 35)

          Download the signed \`.apk\` asset below to install directly on your Android device.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          files: SecurePass-*-signed.apk
          name: Secure Pass ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  dispatch-applify:
    name: Submit signed release to Applify
    needs: [build-and-sign, publish-github-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch to Applify repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ASSET_NAME="SecurePass-${TAG_NAME}-signed.apk"
          jq -n --arg version "$VERSION" --arg tag "$TAG_NAME" --arg asset "$ASSET_NAME" '{event_type:"new_release",client_payload:{source_repo:"saurabhkundu1/secure-password-manager",package_name:"com.applify.securepass",version:$version,version_code:"3",tag:$tag,asset_name:$asset}}' > "$RUNNER_TEMP/applify-dispatch.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/applify-dispatch.json" \
            https://api.github.com/repos/saurabhkundu1/Applify/dispatches