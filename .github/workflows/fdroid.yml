name: Publish F-Droid Repository & GitHub Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build & Sign APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Install Android Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;29.0.3" "build-tools;35.0.0"

      - name: Sign APK with Android SDK apksigner
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign --ks release.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk app-release-aligned.apk
          
          rm -f release.jks

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app-release-signed.apk
          retention-days: 1

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-sign
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Signed APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: release_apk

      - name: Prepare Release Assets & Notes
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="v1.0.1"
          fi
          SIGNED_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
          APK_NAME="SecurePass-${VERSION}-signed.apk"
          cp "$SIGNED_APK" "${APK_NAME}"
          SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')

          cat << EOF > RELEASE_NOTES.md
          # 🔐 Secure Pass ${VERSION}

          ## 🚀 Official Production Release (${VERSION})

          ### 📱 Features
          - **AES-256-GCM Encrypted Vault**: High-security local encrypted storage.
          - **Shuffled Number Pad**: Randomized 12-button lock screen numpad on every launch.
          - **Popular Site Presets**: One-touch quick add for Google, GitHub, Amazon, Netflix, Banking, PayPal, Microsoft, Apple, etc.
          - **24-Hour Master Code Policy**: Mandatory master code verification every 24 hours.
          - **Mandatory 6-Digit Backup Key**: Enforced 6-character backup encryption password policy.
          - **8 Custom Swipe Actions**: Configurable swipe gestures with fading color trails.

          ---

          ### 📦 Verified Release Package
          - **File Name**: \`${APK_NAME}\`
          - **SHA-256 Checksum**: \`${SHA256}\`
          - **Minimum Android Version**: Android 8.0 (API 26)
          - **Target Android Version**: Android 15 (API 35)

          Download the signed \`.apk\` asset below to install directly on your Android device.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SecurePass-*-signed.apk
          name: Secure Pass ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  deploy-fdroid:
    name: Deploy to F-Droid Repository
    needs: build-and-sign
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Signed APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: release_apk

      - name: Build & Deploy F-Droid Repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sudo apt-get update && sudo apt-get install -y aapt python3-pip python3-setuptools libjpeg-dev zlib1g-dev gettext
          pip3 install --user fdroidserver
          export PATH=$PATH:$HOME/.local/bin

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then VERSION="latest"; fi

          # Decode signing keystore for F-Droid index signing
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

          # Clone existing Applify F-Droid repository FIRST
          git clone https://x-access-token:${GH_PAT}@github.com/saurabhkundu1/Applify.git fdroid_repo

          # Decode keystore DIRECTLY inside fdroid_repo/
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > fdroid_repo/keystore.jks

          # Remove non-APK files in repo/ before fdroid update
          rm -f fdroid_repo/repo/.nojekyll fdroid_repo/.nojekyll || true

          mkdir -p fdroid_repo/repo
          mkdir -p fdroid_repo/metadata/com.applify.securepass/en-US/images

          # Copy new signed APK and extract version details
          SIGNED_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
          VC=$(aapt dump badging "$SIGNED_APK" | grep versionCode | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          VN=$(aapt dump badging "$SIGNED_APK" | grep versionName | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")
          if [ -z "$VC" ]; then VC="1"; fi
          if [ -z "$VN" ]; then VN="1.0.0"; fi

          cp "$SIGNED_APK" "fdroid_repo/repo/com.applify.securepass_${VC}.apk"
          cp fastlane/metadata/android/en-US/*.txt fdroid_repo/metadata/com.applify.securepass/en-US/ || true
          cp app/src/main/res/drawable/classic_blue.png fdroid_repo/metadata/com.applify.securepass/en-US/images/icon.png || true
          cp app/src/main/res/drawable/classic_blue.png fdroid_repo/icon.png || true

          # Copy static metadata template and inject version info
          cp metadata/com.applify.securepass.yml fdroid_repo/metadata/com.applify.securepass.yml
          sed -i "s|CurrentVersion: .*|CurrentVersion: \"${VN}\"|" fdroid_repo/metadata/com.applify.securepass.yml
          sed -i "s|CurrentVersionCode: .*|CurrentVersionCode: ${VC}|" fdroid_repo/metadata/com.applify.securepass.yml

          # Copy static config template and inject parameters
          cp fdroid_config.template fdroid_repo/config.yml
          sed -i "s|SDK_PATH_PLACEHOLDER|${ANDROID_HOME}|" fdroid_repo/config.yml
          sed -i "s|KEY_ALIAS_PLACEHOLDER|${{ secrets.KEY_ALIAS }}|" fdroid_repo/config.yml
          sed -i "s|KEYSTORE_PASS_PLACEHOLDER|${{ secrets.KEYSTORE_PASSWORD }}|" fdroid_repo/config.yml
          sed -i "s|KEY_PASS_PLACEHOLDER|${{ secrets.KEY_PASSWORD }}|" fdroid_repo/config.yml

          # Run fdroid update and signindex inside fdroid_repo/
          cd fdroid_repo
          chmod 0600 config.yml keystore.jks
          fdroid update --pretty
          fdroid signindex

          # VERIFY index signing
          if [ ! -f index-v1.jar ] && [ ! -f repo/index-v1.jar ] && [ ! -f index-v1.json ]; then
            echo "CRITICAL ERROR: F-Droid signed index files were NOT generated!"
            exit 1
          fi

          # Sync repo/ contents to root
          cp -r repo/* ./
          touch .nojekyll

          # EXPLICITLY REMOVE SENSITIVE FILES BEFORE GIT ADD
          rm -f config.yml keystore.jks ../keystore.jks repo/config.yml repo/keystore.jks

          # Create GitHub Pages deployment workflow inside Applify repo so GitHub Pages automatically deploys on every update
          mkdir -p .github/workflows
          python3 - << 'PYEOF'
          import textwrap
          content = textwrap.dedent('''\
          name: Deploy GitHub Pages

          on:
            push:
              branches: [ main ]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: "pages"
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-24.04
              steps:
                - name: Checkout Source
                  uses: actions/checkout@v4

                - name: Setup Pages
                  uses: actions/configure-pages@v5

                - name: Upload Artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: '.'

                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          ''')
          with open('.github/workflows/pages.yml', 'w') as f:
              f.write(content)
          PYEOF

          # Commit and push updated index, APKs, and pages workflow to Applify repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Update F-Droid repo ${VERSION} (versionCode ${VC}) and trigger Pages deployment"
            git push origin main
          else
            echo "No changes to commit in Applify repository."
          fi
