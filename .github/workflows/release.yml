name: Build, Sign, Release & F-Droid Publish

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          ./gradlew clean assembleRelease

      - name: Locate Signed APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "No APK found"; exit 1; fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Install Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ github.ref_name }}"
          APK_NAME="SecurePass-${VERSION}.apk"
          cp "${{ steps.locate_apk.outputs.apk_path }}" "${APK_NAME}"
          SHA256=$(sha256sum "${APK_NAME}" | awk '{print $1}')
          echo "apk_name=${APK_NAME}" >> $GITHUB_ENV
          echo "sha256=${SHA256}" >> $GITHUB_ENV
          cat << EOF > RELEASE_NOTES.md
          # Secure Pass ${VERSION}

          ## Secure, offline password manager for Android

          ### Highlights
          - AES-256-GCM encrypted local vault
          - 6-digit master code with optional fingerprint unlock
          - Clipboard auto-clear after 30 seconds
          - Strong password generator
          - Dark/Light/System theme modes
          - Encrypted vault backup and restore

          ### Package
          - File: \`${APK_NAME}\`
          - SHA-256: \`${SHA256}\`
          - Min Android: 8.0 (API 26)
          - Target Android: 15 (API 35)
          EOF

      - name: Delete Old Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases | grep '"id":' | sed -E 's/.*: ([0-9]+).*/\1/')
          for rel_id in $RELEASES; do
            echo "Deleting release ID: $rel_id"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/$rel_id || true
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.apk_name }}
          name: Secure Pass ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Build F-Droid Repository
        run: |
          sudo apt-get update && sudo apt-get install -y aapt python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          export PATH=$PATH:$HOME/.local/bin
          mkdir -p fdroid_repo/repo
          SIGNED_APK="${{ steps.locate_apk.outputs.apk_path }}"
          VC=$(aapt dump badging "$SIGNED_APK" | grep versionCode | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")
          VN=$(aapt dump badging "$SIGNED_APK" | grep versionName | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")
          if [ -z "$VC" ]; then VC="1"; fi
          if [ -z "$VN" ]; then VN="1.0.0"; fi
          cp "$SIGNED_APK" "fdroid_repo/repo/com.applify.securepass_${VC}.apk"
          mkdir -p fdroid_repo/metadata/com.applify.securepass/en-US/images
          cat << EOF > fdroid_repo/metadata/com.applify.securepass.yml
          Categories:
            - Security
          License: MIT
          WebSite: "https://github.com/saurabhkundu1/secure-password-manager"
          SourceCode: "https://github.com/saurabhkundu1/secure-password-manager"
          IssueTracker: "https://github.com/saurabhkundu1/secure-password-manager/issues"
          Name: "Secure Pass"
          Summary: "Offline secure password manager"
          Description: |-
            Fully offline password manager with AES-256-GCM encryption,
            fingerprint unlock, password generator, and clipboard auto-clear.
          AutoName: "Secure Pass"
          CurrentVersion: "${VN}"
          CurrentVersionCode: ${VC}
          EOF
          cd fdroid_repo
          cat << EOF > config.yml
          repo_name: "Applify"
          repo_description: "Applify Official F-Droid Repository"
          repo_url: "https://saurabhkundu1.github.io/secure-password-manager/repo"
          sdk_path: "${ANDROID_HOME}"
          keystore: "../keystore.jks"
          repo_keyalias: "${{ secrets.KEY_ALIAS }}"
          keystorepass: "${{ secrets.KEYSTORE_PASSWORD }}"
          keypass: "${{ secrets.KEY_PASSWORD }}"
          archive_older: 0
          EOF
          fdroid update --pretty
          fdroid signindex
          cp -r repo/* ./
          touch .nojekyll
          touch repo/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './fdroid_repo'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
