plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.applify.securepass'
    compileSdk 35

    defaultConfig {
        applicationId "com.applify.securepass"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Priority: Environment Variable > Gradle Property > Default file
            def ksPath = System.getenv("KEYSTORE_PATH") ?: (project.findProperty("KEYSTORE_PATH") ?: "../secure-pass-key.jks")
            def ksFile = file(ksPath)
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD")

            // Only configure if all properties are present and file exists
            if (ksFile.exists() && ksPass && kAlias && kPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Dynamically assign signing config only if it was configured above
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test:runner:1.5.2'
    testImplementation 'androidx.test:rules:1.5.0'
}